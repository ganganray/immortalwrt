name: Build ImmortalWrt for JDCloud Arthur

on:
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler dwarves ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 1. 引入独立 vmlinux-btf 扩展包（将 BTF 放入 55.6GB 根分区，不占 6MB 内核槽位）
          git clone --depth 1 https://github.com/QiuSimons/vmlinux-btf.git package/vmlinux-btf
          # 2. 修复上游 kmod-sched-bpf 对 act_bpf.ko 的打包 Bug，确保 dae 必需的 cls_bpf.ko 正常打包
          sed -i 's|$(LINUX_DIR)/net/sched/act_bpf.ko||g' package/kernel/linux/modules/netsupport.mk
          sed -i 's|act_bpf||g' package/kernel/linux/modules/netsupport.mk

      - name: Generate Config
        run: |
          # 1. 将内核编译器优化从 -O2 切换为 -Os (OPTIMIZE_FOR_SIZE)，为 uImage.itb 缩减约 700KB 体积
          for cfg in target/linux/generic/config-* target/linux/qualcommax/config-* target/linux/qualcommax/ipq60xx/config-*; do
            if [ -f "$cfg" ]; then
              sed -i 's/CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y/# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE is not set/g' "$cfg"
              echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> "$cfg"
            fi
          done

          # 2. 写入目标机型与功能配置
          cat << 'EOF' > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y

          # 基础 LuCI 界面
          CONFIG_PACKAGE_luci=y

          # 存储与自动挂载驱动
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_e2fsprogs=y

          # ==============================================================================
          # 内核体积瘦身选项（立省约 330KB，彻底告别 6MB 分区溢出）
          # ==============================================================================
          CONFIG_KERNEL_KALLSYMS=n
          CONFIG_KERNEL_KPROBES=n
          CONFIG_KERNEL_BPF_EVENTS=n
          CONFIG_KERNEL_PERF_EVENTS=n

          # ==============================================================================
          # dae v2.x 核心依赖（内核级仅保留最精简的 eBPF 与 Cgroup 钩子，其余全部模块化）
          # ==============================================================================
          CONFIG_KERNEL_BPF_SYSCALL=y
          CONFIG_KERNEL_BPF_JIT=y
          CONFIG_KERNEL_CGROUP_BPF=y
          CONFIG_KERNEL_NET_NS=y

          # 模块化驱动（存放在 55.6GB 根分区中，占内核分区 0 字节）
          CONFIG_PACKAGE_vmlinux-btf=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          # 必备运维工具链与管理服务
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          EOF

          # 3. 修改默认后台 IP 为 192.168.88.1，避开光猫 192.168.1.1
          sed -i 's/192.168.1.1/192.168.88.1/g' package/base-files/files/bin/config_generate

          # 4. 固化出厂默认持久化 Overlay 配置（开机瞬间自动将 55.6GB 分区挂为根目录）
          mkdir -p files/etc/config
          cat << 'EOF' > files/etc/config/fstab
          config global
          	option anon_swap '0'
          	option anon_mount '1'
          	option auto_swap '1'
          	option auto_mount '1'
          	option delay_root '5'
          	option check_fs '0'

          config mount
          	option target '/overlay'
          	option uuid '54508193-8b80-4cf6-9acc-d50c783661af'
          	option enabled '1'
          EOF

          # 5. 补全默认依赖并核验关键配置
          make defconfig
          echo "=== 关键组件配置核验 ==="
          grep -E "CONFIG_PACKAGE_vmlinux-btf|CONFIG_PACKAGE_kmod-veth|CONFIG_PACKAGE_kmod-sched-bpf|CONFIG_KERNEL_KALLSYMS" .config || true

      - name: Download packages
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          ls -lh build_dir/target-*/linux-qualcommax_ipq60xx/jdcloud_re-ss-01-uImage.itb || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-jdcloud-arthur
          path: |
            bin/targets/qualcommax/ipq60xx/*.bin
            build_dir/target-*/linux-qualcommax_ipq60xx/vmlinux-btf*/vmlinux-btf
